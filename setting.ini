[SETTING]

; Titles per page of MyAnimeList's top anime list (html source).
RankIncrement = 50

[PATH]

; One JSON file per title is kept here; titles with a file are skipped on the next run.
TempWorkInfoFolder = tmp/info

[DATABASE]

DatabaseName = anime.db

[JIKAN_EDGE]

; API used by --source jikan-edge. Use your own instance for big crawls.
; (The public Jikan API, api.jikan.moe, shut down on 2026-10-01.)
BaseUrl = https://jikan.lucashdo.com/v1

[MAL]

; MyAnimeList itself (html source, and the links written into the tables).
BaseUrl = https://myanimelist.net
